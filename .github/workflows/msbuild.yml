name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 1. payload DLL, built before the resource script is compiled
      - name: Build payload
        shell: cmd
        run: |
          if not exist build\payload mkdir build\payload
          cl /nologo /LD /MT /O2 /GS- /D_USRDLL payload.c /Fo:build\payload\ /link /OUT:build\payload\hid.dll /PDB:build\payload\hid.pdb
          if errorlevel 1 exit /b 1
          copy /y build\payload\hid.dll hid.dll
          if errorlevel 1 exit /b 1
          dir hid.dll

      # 2. exploit exe, which embeds hid.dll via the rc
      - name: Build exploit
        shell: cmd
        run: |
          msbuild SigDrop.vcxproj /nologo /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=%CD%\out\\" /p:TargetName=lcutil
          if errorlevel 1 exit /b 1

      # 3. sanity checks so a silent failure doesn't produce a broken exe
      - name: Verify
        shell: pwsh
        run: |
          $exe = Get-ChildItem out -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "build produced no exe" }
          $dll = Get-Item build\payload\hid.dll
          Write-Host "exe: $($exe.Length) bytes / dll: $($dll.Length) bytes"
          if ($exe.Length -lt 60000) { throw "exe is only $($exe.Length) bytes - payload probably not embedded" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $exe.FullName dist\
          Copy-Item $dll.FullName dist\

      - uses: actions/upload-artifact@v4
        with:
          name: lcutil
          path: dist\
          if-no-files-found: error
